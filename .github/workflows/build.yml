name: Build Jayra APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$DATA" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret kosong!"
            exit 1
          fi
          echo "$DATA" | base64 -di > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "ERROR: google-services.json kosong setelah decode!"
            exit 1
          fi
          echo "=== Ukuran google-services.json ==="
          ls -lh app/google-services.json
          echo "=== Package name ==="
          grep -o '"package_name": "[^"]*"' app/google-services.json || echo "package_name TIDAK ADA"

      - name: Generate debug keystore + Print SHA-1
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "===================== SHA-1 ====================="
          keytool -list -v \
            -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            | grep "SHA1:"
          echo "================================================="

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
